<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151c"><title>Codex</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#1a2531;--line:#2b3846;--muted:#8fa0b3;--ink:#eef3f9;--accent:#8fd9c4}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#131b24}
header b{font-size:15px}header span{color:var(--muted);font-size:11px}
#gear{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:5px 10px;font-size:12px}
main{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:#223430;border:1px solid #33564a}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.err{align-self:flex-start;background:#3a2226;border:1px solid #6b3f45;color:#ffc9cc}
.hint{color:var(--muted);text-align:center;font-size:13px;margin-top:12vh;line-height:2}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#131b24}
textarea{flex:1;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;resize:none;min-height:46px;max-height:140px}
button{border:0;border-radius:12px;padding:0 18px;background:var(--accent);color:#0f2a24;font-weight:600;font-size:15px}
button:disabled{opacity:.45}
#keybox{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px}
#keybox.on{display:grid}
#keybox div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(420px,92vw)}
#keybox input{width:100%;margin:10px 0;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0e161f;color:var(--ink);font:inherit}
#keybox p{color:var(--muted);font-size:12px;margin:0}
</style></head><body>
<header><b>Codex</b><span id="meta">本地界面</span><button id="gear">令牌</button></header>
<main id="log"><div class="hint">在手机上直接和模型对话<br><small>令牌只保存在本机私有目录</small></div></main>
<form id="f"><textarea id="q" rows="1" placeholder="发消息…"></textarea><button id="send">发送</button></form>
<div id="keybox"><div>
  <b>设置 API 令牌</b>
  <p>仅写入本应用私有目录（权限 600），不会上传到别处。</p>
  <input id="key" type="password" placeholder="sk-..." autocomplete="off">
  <p id="kerr" style="color:#ffb0b6"></p>
  <div style="display:flex;gap:8px;margin-top:12px"><button id="ksave" style="flex:1;padding:9px">保存</button><button id="kclose" style="background:none;border:1px solid var(--line);color:var(--muted)">取消</button></div>
</div></div>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),send=document.getElementById('send'),
      box=document.getElementById('keybox'),meta=document.getElementById('meta');
let busy=false,turns=[];
async function state(){const r=await fetch('/api/state');const s=await r.json();
  meta.textContent=s.model+(s.hasKey?'':' · 未设令牌');
  if(!s.hasKey)box.classList.add('on');}
function bubble(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight;return d;}
document.getElementById('gear').onclick=()=>box.classList.add('on');
document.getElementById('kclose').onclick=()=>box.classList.remove('on');
document.getElementById('ksave').onclick=async()=>{
  const key=document.getElementById('key').value.trim();const err=document.getElementById('kerr');
  const r=await fetch('/api/key',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key})});
  const d=await r.json(); if(!r.ok){err.textContent=d.error||'保存失败';return;}
  err.textContent='';document.getElementById('key').value='';box.classList.remove('on');state();};
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,140)+'px'});
document.getElementById('f').onsubmit=async(e)=>{
  e.preventDefault();const text=q.value.trim();if(!text||busy)return;
  const hint=log.querySelector('.hint');if(hint)hint.remove();
  turns.push({role:'user',text});bubble('me',text);q.value='';q.style.height='auto';
  busy=true;send.disabled=true;const out=bubble('ai','');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:turns})});
    if(!r.ok){const d=await r.json().catch(()=>({error:'HTTP '+r.status}));out.classList.add('err');out.textContent=d.error||'请求失败';turns.pop();return;}
    const reader=r.body.getReader();const dec=new TextDecoder();let buf='',acc='',errText='';
    for(;;){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        const line=chunk.split('\n').find(l=>l.startsWith('data: '));if(!line)continue;
        let ev;try{ev=JSON.parse(line.slice(6))}catch{continue}
        if(ev.delta){acc+=ev.delta;out.textContent=acc;log.scrollTop=log.scrollHeight}
        if(ev.error){errText=ev.error}}}
    if(errText){out.classList.add('err');out.textContent=errText;turns.pop();}
    else if(acc)turns.push({role:'assistant',text:acc});else{turns.pop();out.textContent='（没有返回内容）'}
  }catch(err){out.classList.add('err');out.textContent=String(err.message||err);turns.pop();}
  finally{busy=false;send.disabled=false;q.focus()}};
state();
</script></body></html>
